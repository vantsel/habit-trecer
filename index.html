<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Трекер привычек</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --text: var(--tg-theme-text-color, #111111);
  --hint: var(--tg-theme-hint-color, #7d7d7d);
  --btn: var(--tg-theme-button-color, #2481cc);
  --btn-text: var(--tg-theme-button-text-color, #ffffff);
  --card: var(--tg-theme-secondary-bg-color, #f1f1f4);
  --done: #3fb950;
  --miss: #e5534b;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: 12px 12px 40px;
}
#app { max-width: 480px; margin: 0 auto; }
button { font: inherit; color: inherit; border: none; cursor: pointer; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
.chip {
  flex: 0 0 auto; padding: 8px 14px; border-radius: 16px;
  background: var(--card); white-space: nowrap;
}
.chip.active { background: var(--btn); color: var(--btn-text); }
.chip.plus { font-weight: 600; }

.nav { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 8px; }
.nav .title { font-size: 18px; font-weight: 600; }
.nav button { width: 40px; height: 40px; border-radius: 12px; background: var(--card); font-size: 20px; }
.nav button:disabled { opacity: .3; }

.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dow { text-align: center; font-size: 12px; color: var(--hint); padding-bottom: 2px; }
.day {
  aspect-ratio: 1; border-radius: 10px; background: var(--card);
  display: flex; align-items: center; justify-content: center; font-size: 15px;
}
.day.done { background: var(--done); color: #fff; font-weight: 600; }
.day.miss { background: rgba(229, 83, 75, .22); color: var(--miss); }
.day.future { opacity: .35; pointer-events: none; }
.day.today { outline: 2px solid var(--btn); outline-offset: 1px; }
.blank { visibility: hidden; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.stat { background: var(--card); border-radius: 12px; padding: 10px; text-align: center; }
.stat .num { font-size: 22px; font-weight: 700; }
.stat .lbl { font-size: 12px; color: var(--hint); margin-top: 2px; }
.stat.miss .num { color: var(--miss); }
.stat.ok .num { color: var(--done); }

.missed { margin-top: 14px; font-size: 14px; line-height: 1.45; }
.missed .lbl { color: var(--hint); }
.footer { margin-top: 22px; text-align: center; }
.link { background: none; color: var(--miss); padding: 8px; font-size: 14px; }

.empty { text-align: center; padding: 48px 12px; }
.empty p { color: var(--hint); }
.primary { background: var(--btn); color: var(--btn-text); padding: 12px 20px; border-radius: 12px; font-size: 16px; }

.overlay {
  position: fixed; inset: 0; background: rgba(0, 0, 0, .45);
  display: none; align-items: flex-end;
}
.overlay.open { display: flex; }
.sheet {
  background: var(--bg); width: 100%; padding: 16px 16px 28px;
  border-radius: 16px 16px 0 0; max-width: 480px; margin: 0 auto;
}
.sheet h3 { margin: 0 0 12px; }
.sheet input {
  width: 100%; padding: 12px; border-radius: 10px; border: none;
  background: var(--card); color: var(--text); font-size: 16px; margin-bottom: 12px;
}
.sheet .row { display: flex; gap: 8px; }
.sheet .row button { flex: 1; padding: 12px; border-radius: 12px; font-size: 16px; }
.sheet .cancel { background: var(--card); }
</style>
</head>
<body>
<div id="app"></div>

<div class="overlay" id="overlay">
  <form class="sheet" id="sheet" autocomplete="off">
    <h3>Новая привычка</h3>
    <input id="nameInput" type="text" maxlength="40" placeholder="Например: зарядка">
    <div class="row">
      <button type="button" class="cancel" id="cancelBtn">Отмена</button>
      <button type="submit" class="primary">Добавить</button>
    </div>
  </form>
</div>

<script>
(() => {
'use strict';

const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const DOW = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MAX_HABITS = 20;

// ---------- хранилище: Telegram CloudStorage, а в обычном браузере localStorage ----------
const LS = 'ht:';
const store = {
  get(key) {
    return new Promise(res => {
      if (inTg) tg.CloudStorage.getItem(key, (err, v) => res(err ? null : (v || null)));
      else { try { res(localStorage.getItem(LS + key)); } catch (e) { res(null); } }
    });
  },
  set(key, val) {
    return new Promise((res, rej) => {
      if (inTg) tg.CloudStorage.setItem(key, val, err => err ? rej(err) : res());
      else { try { localStorage.setItem(LS + key, val); res(); } catch (e) { rej(e); } }
    });
  },
  keys() {
    return new Promise(res => {
      if (inTg) tg.CloudStorage.getKeys((err, keys) => res(err ? [] : keys));
      else {
        const out = [];
        try {
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith(LS)) out.push(k.slice(LS.length));
          }
        } catch (e) {}
        res(out);
      }
    });
  },
  remove(keys) {
    return new Promise(res => {
      if (inTg) tg.CloudStorage.removeItems(keys, () => res());
      else { try { keys.forEach(k => localStorage.removeItem(LS + k)); } catch (e) {} res(); }
    });
  }
};

// ---------- утилиты ----------
const pad = n => String(n).padStart(2, '0');
const dateStr = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const todayStr = () => { const n = new Date(); return dateStr(n.getFullYear(), n.getMonth(), n.getDate()); };
const monthKey = (id, y, m) => `d_${id}_${y}-${pad(m + 1)}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const notify = msg => (inTg && tg.showAlert) ? tg.showAlert(msg) : alert(msg);
const confirmAsk = (msg, cb) => {
  if (inTg && tg.showConfirm) tg.showConfirm(msg, ok => { if (ok) cb(); });
  else if (confirm(msg)) cb();
};
const haptic = () => { if (inTg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} } };

// ---------- состояние ----------
const now0 = new Date();
const state = { habits: [], currentId: null };
const view = { y: now0.getFullYear(), m: now0.getMonth() };
const cache = new Map(); // ключ месяца -> Set дней
const cur = () => state.habits.find(h => h.id === state.currentId) || null;

async function getMonth(id, y, m) {
  const k = monthKey(id, y, m);
  if (!cache.has(k)) {
    const raw = await store.get(k);
    let arr = [];
    try { arr = JSON.parse(raw) || []; } catch (e) {}
    if (!cache.has(k)) cache.set(k, new Set(arr));
  }
  return cache.get(k);
}

async function calcStreak(id) {
  const t = new Date();
  const d = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const first = await getMonth(id, d.getFullYear(), d.getMonth());
  if (!first.has(d.getDate())) d.setDate(d.getDate() - 1); // сегодня ещё можно отметить
  let n = 0;
  for (let i = 0; i < 400; i++) {
    const s = await getMonth(id, d.getFullYear(), d.getMonth());
    if (!s.has(d.getDate())) break;
    n++;
    d.setDate(d.getDate() - 1);
  }
  return n;
}

// ---------- отрисовка ----------
const app = document.getElementById('app');

function render() {
  if (!state.habits.length) {
    app.innerHTML = `
      <div class="empty">
        <h2>Пока нет привычек</h2>
        <p>Добавь первую и отмечай выполненные дни в календаре.</p>
        <button class="primary" data-act="add">Добавить привычку</button>
      </div>`;
    return;
  }

  const h = cur();
  const { y, m } = view;
  const set = cache.get(monthKey(h.id, y, m)) || new Set();
  const today = todayStr();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const offset = (new Date(y, m, 1).getDay() + 6) % 7; // неделя с понедельника
  const isCurrentMonth = y === now0.getFullYear() && m === now0.getMonth();

  let cells = DOW.map(d => `<div class="dow">${d}</div>`).join('');
  cells += '<div class="blank"></div>'.repeat(offset);
  const missed = [];
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = dateStr(y, m, d);
    const done = set.has(d);
    const future = ds > today;
    const miss = !done && ds < today && ds >= h.created;
    if (miss) missed.push(d);
    const cls = ['day'];
    if (done) cls.push('done');
    else if (miss) cls.push('miss');
    if (future) cls.push('future');
    if (ds === today) cls.push('today');
    cells += `<button class="${cls.join(' ')}" data-act="day" data-d="${d}">${d}</button>`;
  }

  const chips = state.habits.map(x =>
    `<button class="chip ${x.id === h.id ? 'active' : ''}" data-act="habit" data-id="${x.id}">${esc(x.name)}</button>`
  ).join('') + `<button class="chip plus" data-act="add">+</button>`;

  let missedHtml;
  if (missed.length) {
    missedHtml = `<span class="lbl">Пропущено:</span> ${missed.join(', ')} ${MONTHS_GEN[m]}`;
  } else if (ds_has_past_days(y, m, h, today)) {
    missedHtml = `<span class="lbl">Пропусков в этом месяце нет</span>`;
  } else {
    missedHtml = '';
  }

  app.innerHTML = `
    <div class="chips">${chips}</div>
    <div class="nav">
      <button data-act="prev">‹</button>
      <div class="title">${MONTHS[m]} ${y}</div>
      <button data-act="next" ${isCurrentMonth ? 'disabled' : ''}>›</button>
    </div>
    <div class="grid">${cells}</div>
    <div class="stats">
      <div class="stat ok"><div class="num">${set.size}</div><div class="lbl">выполнено</div></div>
      <div class="stat miss"><div class="num">${missed.length}</div><div class="lbl">пропущено</div></div>
      <div class="stat"><div class="num" id="streak">…</div><div class="lbl">серия подряд</div></div>
    </div>
    <div class="missed">${missedHtml}</div>
    <div class="footer"><button class="link" data-act="del">Удалить привычку</button></div>`;
}

function ds_has_past_days(y, m, h, today) {
  const first = dateStr(y, m, 1);
  const last = dateStr(y, m, new Date(y, m + 1, 0).getDate());
  return today > first && last >= h.created;
}

async function updateStreak(id) {
  const n = await calcStreak(id);
  const el = document.getElementById('streak');
  if (el && state.currentId === id) el.textContent = n;
}

async function refresh() {
  const h = cur();
  if (h) await getMonth(h.id, view.y, view.m);
  render();
  if (h) updateStreak(h.id);
}

// ---------- действия ----------
async function toggle(d) {
  const h = cur();
  if (!h) return;
  const set = await getMonth(h.id, view.y, view.m);
  const had = set.has(d);
  if (had) set.delete(d); else set.add(d);
  haptic();
  render();
  updateStreak(h.id);
  try {
    await store.set(monthKey(h.id, view.y, view.m), JSON.stringify([...set].sort((a, b) => a - b)));
  } catch (e) {
    if (had) set.add(d); else set.delete(d);
    render();
    updateStreak(h.id);
    notify('Не удалось сохранить отметку. Попробуй ещё раз.');
  }
}

async function addHabit(rawName) {
  const name = rawName.trim().slice(0, 40);
  if (!name) return;
  if (state.habits.length >= MAX_HABITS) { notify('Максимум ' + MAX_HABITS + ' привычек.'); return; }
  const h = { id: Math.random().toString(36).slice(2, 8), name, created: todayStr() };
  state.habits.push(h);
  try {
    await store.set('habits', JSON.stringify(state.habits));
  } catch (e) {
    state.habits.pop();
    notify('Не удалось сохранить привычку.');
    return;
  }
  state.currentId = h.id;
  view.y = now0.getFullYear();
  view.m = now0.getMonth();
  await refresh();
}

async function deleteHabit(id) {
  const prefix = `d_${id}_`;
  const keys = (await store.keys()).filter(k => k.startsWith(prefix));
  const before = state.habits;
  state.habits = state.habits.filter(h => h.id !== id);
  try {
    await store.set('habits', JSON.stringify(state.habits));
  } catch (e) {
    state.habits = before;
    notify('Не удалось удалить.');
    return;
  }
  if (keys.length) await store.remove(keys);
  for (const k of [...cache.keys()]) if (k.startsWith(prefix)) cache.delete(k);
  state.currentId = state.habits[0] ? state.habits[0].id : null;
  await refresh();
}

// ---------- события ----------
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'day') toggle(+el.dataset.d);
  else if (act === 'habit') { state.currentId = el.dataset.id; refresh(); }
  else if (act === 'prev') { view.m--; if (view.m < 0) { view.m = 11; view.y--; } refresh(); }
  else if (act === 'next') {
    if (view.y === now0.getFullYear() && view.m === now0.getMonth()) return;
    view.m++; if (view.m > 11) { view.m = 0; view.y++; }
    refresh();
  }
  else if (act === 'add') openSheet();
  else if (act === 'del') {
    const h = cur();
    if (h) confirmAsk(`Удалить «${h.name}» и всю историю отметок?`, () => deleteHabit(h.id));
  }
});

const overlay = document.getElementById('overlay');
const input = document.getElementById('nameInput');
function openSheet() { input.value = ''; overlay.classList.add('open'); setTimeout(() => input.focus(), 50); }
function closeSheet() { overlay.classList.remove('open'); input.blur(); }
document.getElementById('cancelBtn').addEventListener('click', closeSheet);
overlay.addEventListener('click', e => { if (e.target === overlay) closeSheet(); });
document.getElementById('sheet').addEventListener('submit', e => {
  e.preventDefault();
  const v = input.value;
  closeSheet();
  addHabit(v);
});

// ---------- старт ----------
(async function init() {
  const raw = await store.get('habits');
  try { state.habits = JSON.parse(raw) || []; } catch (e) { state.habits = []; }
  state.currentId = state.habits[0] ? state.habits[0].id : null;
  await refresh();
})();
})();
</script>
</body>
</html>
